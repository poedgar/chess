<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizzes · Chess Classics</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="board.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <header class="border-b border-slate-800 bg-slate-950/60">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <span class="text-3xl leading-none text-amber-400">♞</span>
      <div class="flex-1">
        <h1 class="text-lg font-semibold tracking-tight">Chess Classics · Quizzes</h1>
        <p class="text-xs text-slate-400">Test yourself on the famous games</p>
      </div>
      <a href="index.html" class="text-sm font-medium text-slate-200 hover:text-amber-400 rounded-lg px-3 py-2 ring-1 ring-slate-700 hover:ring-amber-500/60">← Games</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- Category picker -->
    <section id="view-pick">
      <h2 class="text-xl font-semibold">Choose a category</h2>
      <p class="mt-1 text-sm text-slate-400">Every question is a real position from one of the classic games. Questions you miss come back in Review on the games page.</p>
      <div id="cat-grid" class="mt-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>

    <!-- Quiz runner -->
    <section id="view-run" class="hidden grid gap-6 grid-cols-[minmax(0,1fr)] lg:grid-cols-[minmax(0,560px)_minmax(0,1fr)] items-start">
      <div>
        <div class="flex items-baseline justify-between text-sm mb-2">
          <div id="top-player" class="font-medium truncate"></div>
          <div id="turn" class="text-xs text-slate-400 shrink-0 ml-2"></div>
        </div>
        <div id="board" class="w-full aspect-square grid grid-cols-8 grid-rows-8 rounded-md overflow-hidden shadow-2xl ring-1 ring-black/40"></div>
        <div class="flex items-baseline justify-between text-sm mt-2">
          <div id="bottom-player" class="font-medium truncate"></div>
        </div>
      </div>

      <div class="bg-slate-800/60 rounded-xl p-5">
        <div class="flex items-center gap-3 text-sm">
          <button id="btn-back" class="text-slate-400 hover:text-amber-400">← Categories</button>
          <span class="flex-1"></span>
          <span id="run-score" class="text-slate-300"></span>
        </div>
        <div class="mt-3 h-1.5 rounded-full bg-slate-900 overflow-hidden"><div id="run-bar" class="h-full bg-amber-500 transition-all"></div></div>
        <p id="run-progress" class="mt-3 text-xs uppercase tracking-wider text-slate-400"></p>
        <p id="run-game" class="mt-1 text-xs text-slate-500"></p>
        <p id="run-question" class="mt-3 text-base leading-relaxed"></p>
        <div id="run-choices" class="mt-4 flex flex-col gap-2"></div>
        <p id="run-msg" class="mt-3 text-sm"></p>
        <p id="run-explain" class="hidden mt-3 text-sm text-slate-200 leading-relaxed border-l-2 border-amber-500/70 pl-3"></p>
        <div id="run-replay" class="hidden mt-3 flex flex-wrap items-center gap-x-3 gap-y-2">
          <button id="btn-replay" class="shrink-0 bg-sky-900/70 hover:bg-sky-800 text-sky-100 rounded px-3 py-1.5 text-sm"></button>
          <span id="run-line" class="font-mono text-xs text-slate-400 leading-relaxed"></span>
        </div>
        <div class="mt-5 flex flex-wrap gap-2 text-sm">
          <button id="btn-hint" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-1.5">Hint</button>
          <button id="btn-show" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-1.5">Show answer</button>
          <span class="flex-1"></span>
          <button id="btn-next" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded px-4 py-1.5">Next</button>
        </div>
      </div>
    </section>

    <!-- Round summary -->
    <section id="view-done" class="hidden max-w-xl mx-auto text-center bg-slate-800/60 rounded-xl p-8">
      <p class="text-5xl leading-none text-amber-400">♛</p>
      <h2 id="done-title" class="mt-4 text-xl font-semibold"></h2>
      <p id="done-text" class="mt-2 text-sm text-slate-300"></p>
      <ul id="done-missed" class="mt-4 text-left text-sm space-y-1"></ul>
      <div class="mt-6 flex flex-wrap justify-center gap-2 text-sm">
        <button id="btn-retry" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded px-4 py-2">Retry missed</button>
        <button id="btn-again" class="bg-slate-700 hover:bg-slate-600 rounded px-4 py-2">Play again</button>
        <button id="btn-cats" class="bg-slate-700 hover:bg-slate-600 rounded px-4 py-2">Categories</button>
      </div>
    </section>
  </main>

  <script src="pgn.js"></script>
  <script src="engine.js"></script>
  <script src="games.js"></script>
  <script src="quizzes.js"></script>
  <script src="quiz-page.js"></script>
</body>
</html>
